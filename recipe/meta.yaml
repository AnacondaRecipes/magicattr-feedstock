{% set name = "magicattr" %}
{% set version = "0.1.7" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/frmdstryr/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 5d9495ed1bc7b76835512ceec76862d26c935bed40335c8119b431f09806683e

build:
  number: 0
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python
    - setuptools
    - wheel
  run:
    - python

test:
  source_files:
    - tests.py
  imports:
    - magicattr
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - pytest -v tests.py

about:
  home: https://github.com/frmdstryr/magicattr
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: magicattr
  description: |
    A getattr and setattr that works on nested objects, lists, dictionaries, and any combination thereof without resorting to eval.
  doc_url: https://github.com/frmdstryr/magicattr
  dev_url: https://github.com/frmdstryr/magicattr

extra:
  recipe-maintainers:
    - mukhery
